version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: arazzo-mcp
    binary: arazzo-mcp
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: linux
        goarch: arm64
      - goos: windows
        goarch: arm64

archives:
  - format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

brews:
  - repository:
      owner: HimethW
      name: homebrew-tap
    directory: Formula
    homepage: https://github.com/HimethW/arazzo-mcp-gen
    description: "A CLI tool to generate MCP servers from Arazzo specifications."
    install: |
      bin.install "arazzo-mcp"
    test: |
      system "#{bin}/arazzo-mcp", "--version"
